<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Aussie 8</title>
<meta name="theme-color" content="#2e1a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../assets/icon-192.png">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: loud 32-bit arcade cabinet, outback stadium at dusk.
   IDEA: a coin-op cabinet whose screen runs a pixel-art trophy-truck race.
   PICTURE: the player's own title art, then the dithered red-dirt arena itself.
   COLOUR and TYPE: dusk purple housing, green and gold, red ochre; Press Start 2P marquee + Rubik.
   LAYOUT: marquee, 3:2 screen; on phones the race goes fullscreen with thumb controls at the sides; menus flow in one column inside the screen. */
:root{color-scheme:dark;--bg:#140b22;--ink:#fbf3e4;--mute:#cdb9a6;--gold:#ffcd00;--green:#00843d;--lime:#5fd37e;--ochre:#d9763a;--bad:#ff5468;--good:#7fe08a;--line:#43295f}
:root[data-theme=light],:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1100px 540px at 50% -10%,#4a2370,transparent 70%),var(--bg);color:var(--ink);font:16px/1.55 Rubik,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:clamp(12px,3vw,32px)}
.marquee{display:flex;align-items:flex-end;justify-content:space-between;gap:8px 20px;flex-wrap:wrap;margin-bottom:14px}
.logo{font-family:'Press Start 2P',monospace;font-size:clamp(20px,3.6vw,34px);color:var(--gold);text-shadow:3px 3px 0 var(--green),5px 5px 0 #000;line-height:1.25;margin:0}
.sub{color:var(--mute);font-size:14px;margin:0}
.cab{background:linear-gradient(#2c1846,#160c24);border:3px solid #47306a;border-radius:22px;padding:clamp(6px,1.5vw,18px);box-shadow:0 30px 60px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.06)}
.screen{position:relative;aspect-ratio:3/2;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 0 0 2px #5a3a80,0 0 40px rgba(255,205,0,.08)}
.screen canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;image-rendering:pixelated}
.screen.menu{aspect-ratio:auto;min-height:min(80vh,640px)}
.screen.menu canvas{object-fit:cover;filter:blur(4px) brightness(.22) saturate(1.1)}
.ov{position:relative;z-index:2;padding:clamp(14px,3vw,36px);display:flex;justify-content:center}
.ov[hidden]{display:none}
.screen.title .ov{position:absolute;inset:0;padding:0}
.start{position:absolute;inset:0;width:100%;height:100%;background:transparent;border:0;cursor:pointer;padding:0}
.press{position:absolute;left:26.6%;top:88.4%;width:45.8%;height:7.2%;border:3px solid var(--gold);border-radius:6px;box-shadow:0 0 18px rgba(255,205,0,.8),inset 0 0 12px rgba(255,205,0,.5);animation:blink 1.1s steps(2,jump-none) infinite}
@keyframes blink{50%{opacity:0}}
.panel{width:100%;max-width:900px}
h2{font:800 clamp(26px,3.6vw,40px)/1.05 Rubik,sans-serif;margin:0 0 12px;text-wrap:balance}
h3{font:800 18px/1.2 Rubik,sans-serif;margin:0 0 10px}
.kicker{color:var(--lime);font-size:14px;font-weight:600;margin:0 0 6px}
.story{font-size:17px;max-width:66ch;margin:0 0 18px}
.muted{color:var(--mute);font-size:14px}
.btn{font:600 16px Rubik,sans-serif;min-height:48px;padding:12px 22px;border-radius:10px;border:2px solid var(--gold);background:var(--gold);color:#1a0f1f;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
button:focus-visible{outline:3px solid var(--lime);outline-offset:2px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.title-logo{font-family:'Press Start 2P',monospace;font-size:clamp(28px,6vw,60px);line-height:1.15;color:var(--gold);text-shadow:4px 4px 0 var(--green),7px 7px 0 #000;margin:6px 0 16px}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px;margin-top:22px}
.key{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.key b{display:block;color:var(--gold);font-size:13px}
.choices{display:grid;gap:10px}
.choice{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center;text-align:left;font:16px/1.4 Rubik,sans-serif;color:var(--ink);background:rgba(255,255,255,.04);border:2px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;min-height:56px}
.choice:hover:not(:disabled){border-color:var(--c,var(--lime));background:rgba(255,255,255,.07)}
.choice:disabled{opacity:.45;cursor:not-allowed}
.choice small{grid-column:2;color:var(--bad)}
.tag{font-size:12px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--c);color:#1a0f1f;white-space:nowrap}
.good{--c:var(--good)}.bad{--c:var(--bad)}.neutral{--c:#c0abd6}.risky{--c:var(--gold)}
.riders{display:flex;gap:8px;align-items:center;margin:-6px 0 16px;flex-wrap:wrap}
.face{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--c);color:#1a0f1f;font-weight:800;flex:none}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}
.pill{font-size:14px;font-weight:600;padding:4px 10px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.pill.up{color:var(--good);border-color:rgba(127,224,138,.4)}.pill.dn{color:var(--bad);border-color:rgba(255,84,104,.4)}
.react{display:flex;gap:12px;align-items:flex-start;margin:0 0 10px}
.react q{font-style:italic}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));gap:12px}
.card{background:rgba(22,11,34,.8);border:1px solid var(--line);border-radius:12px;padding:16px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:7px 0}
.row.two{grid-template-columns:minmax(0,1fr) auto}
.row small{display:block;color:var(--mute);font-size:13px}
.pips{display:flex;gap:3px}.pips i{width:12px;height:10px;border-radius:2px;background:#3e2a55}.pips i.on{background:var(--gold)}
.meter{height:10px;border-radius:5px;background:linear-gradient(90deg,var(--bad),#6f5a80 50%,var(--good));position:relative;margin:8px 0 4px}
.meter b{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;background:#fff;left:calc(var(--v) * 1% - 2px);box-shadow:0 0 6px #fff}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--mute)}
.money{font:800 30px/1 Rubik,sans-serif;color:var(--gold);white-space:nowrap}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--mute);font-weight:600;font-size:13px}
td.n{text-align:right;white-space:nowrap}
.dot{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px;box-shadow:0 0 0 1px rgba(0,0,0,.5)}
.me td{color:var(--gold);font-weight:600}
.note{border-left:3px solid var(--gold);padding:8px 12px;background:rgba(255,205,0,.07);border-radius:0 8px 8px 0;margin:10px 0}
#pad{position:absolute;inset:0;z-index:4;display:grid;grid-template-columns:1fr 1fr;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pad[hidden]{display:none}
#pad>*{direction:ltr}
#pad.lefty{direction:rtl}
.zone{position:relative;touch-action:none}
.pb{position:absolute;display:grid;place-items:center;border-radius:50%;font:11px/1 'Press Start 2P',monospace;color:#fff;background:rgba(20,10,34,.55);border:3px solid rgba(255,255,255,.4);box-shadow:0 5px 0 rgba(0,0,0,.45);pointer-events:none;transition:transform .06s,background .06s}
.pb.on{transform:scale(.9);background:rgba(255,255,255,.28)}
.gas{width:116px;height:116px;right:18px;bottom:20px;border-color:#ffcd00;color:#ffe39a}
.nos{width:100px;height:100px;right:146px;bottom:28px;border-color:#19c46a;color:#c8f7d8}
.brk{width:80px;height:80px;right:36px;bottom:150px;border-color:#e63946;color:#ffc0c5;font-size:9px}
.lr{width:100px;height:100px;bottom:24px;font-size:30px}.lr.l{left:18px}.lr.r{left:134px}
#pad.m-stick .gas,#pad.m-stick .lr{display:none}
#pad.m-stick .nos{width:120px;height:120px;right:20px;bottom:22px;font-size:12px}
#pad.m-stick .brk{right:156px;bottom:34px}
@media (orientation:landscape){#pad.m-stick .brk{right:40px;bottom:160px}}
#pad.lefty .act{transform:scaleX(-1)}#pad.lefty .act .pb,#pad.lefty .act .hint{transform:scaleX(-1)}#pad.lefty .act .pb.on{transform:scaleX(-1) scale(.9)}
#pad.lefty .lr.l{left:auto;right:134px}#pad.lefty .lr.r{left:auto;right:18px}
#stick{position:absolute;width:136px;height:136px;margin:-68px 0 0 -68px;border-radius:50%;border:3px solid rgba(255,255,255,.4);background:rgba(20,10,34,.35);display:none;pointer-events:none}
#stick.on{display:block}
#stick i{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:rgba(255,205,0,.8);box-shadow:0 0 14px rgba(255,205,0,.6)}
.hint{position:absolute;left:8%;right:8%;top:38%;font:11px/1.8 'Press Start 2P',monospace;color:#fff;text-align:center;text-shadow:2px 2px 0 #000;opacity:0;transition:opacity .4s;pointer-events:none}
#pad.hints .hint{opacity:1}
#pauseBtn{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:rgba(20,10,34,.6);color:#fff;font:12px 'Press Start 2P',monospace;z-index:5;touch-action:none}
.rot{display:none}
.screen.playing{position:fixed;inset:0;z-index:60;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border-radius:0;background:#0b0612;box-shadow:none}
.screen.playing canvas{left:50%;top:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(100vw,150vh);width:min(100vw,150dvh);height:auto}
@media (orientation:portrait){.screen.playing canvas{top:0;transform:translateX(-50%)}#pauseBtn{top:calc(66.7vw + 10px)}
 .screen.playing .rot{display:block;position:absolute;left:70px;right:70px;top:calc(66.7vw + 18px);margin:0;text-align:center;color:var(--mute);font-size:13px;pointer-events:none;z-index:5}
 .hint{top:auto;bottom:190px}}
.wn{margin-top:14px}.wn summary{cursor:pointer;min-height:44px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}.wn ul{margin:8px 0 10px;padding:0;list-style:none;display:grid;gap:8px}.wn li{font-size:15px}
.wtag{display:inline-block;min-width:72px;margin-right:6px;padding:1px 8px;border-radius:5px;font-size:12px;font-weight:800;text-align:center;text-transform:uppercase;color:#1a0f1f;background:#8af28a}.wtag.improved{background:#8cc4ff}.wtag.fixed{background:#ffb08a}
.seg{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 10px}
.seg .btn{flex:1 1 140px}
.seg .btn[aria-pressed=false]{background:transparent;color:var(--ink);border-color:var(--line)}
.foot{color:var(--mute);font-size:13px;margin-top:12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
@media(max-width:600px){.ov{padding:14px}.story{font-size:16px}}
@media(prefers-reduced-motion:reduce){.press{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="marquee">
    <h1 class="logo">AUSSIE 8</h1>
    <p class="sub">Outback trophy-truck racing. Every choice rides shotgun.</p>
  </header>
  <div class="cab">
    <div class="screen title" id="screen">
      <canvas id="cv" width="960" height="640" aria-label="Race track"></canvas>
      <div class="ov" id="ov"></div>
      <div id="pad" hidden>
        <div class="zone steer"><span class="hint" id="hintL"></span><div id="stick"><i></i></div><span class="pb lr l" data-k="l">&#9664;</span><span class="pb lr r" data-k="r">&#9654;</span></div>
        <div class="zone act"><span class="hint" id="hintR"></span><span class="pb brk" data-k="b">BRAKE</span><span class="pb nos" data-k="n">NITRO</span><span class="pb gas" data-k="g">GAS</span></div>
        <button id="pauseBtn" aria-label="Pause">II</button>
        <p class="rot">Turn your phone sideways for a bigger track</p>
      </div>
    </div>
    </div>
  </div>
  <div class="foot"><span>Keyboard: arrows or WASD to drive · Space for nitro · P to pause · Phones: drag to steer</span><span>Progress saves in this browser</span></div>
</div>
<script src="art/manifest.js"></script>
<script>
{
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),W=960,H=640,AW=480,AH=320,OY=40;
const ov=document.getElementById('ov'),scr=document.getElementById('screen'),pad=document.getElementById('pad'),stickEl=document.getElementById('stick');
const TOUCH=matchMedia('(pointer:coarse)').matches||location.hash==='#touch';
let CTL={mode:'stick',lefty:false};try{Object.assign(CTL,JSON.parse(localStorage.getItem('aussie8-ctl')||'{}'))}catch(e){}
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const buf=document.createElement('canvas');buf.width=AW;buf.height=AH;const bx=buf.getContext('2d');bx.imageSmoothingEnabled=false;
const ARTM=window.A8_ART||null,ART={ready:false,img:{}};
const artUrl=p=>ARTM&&p?ARTM.base+p:'';
const titleImg=new Image();titleImg.src='title.jpg';
const clamp=(v,a,b)=>v<a?a:v>b?b:v,rnd=(a,b)=>a+Math.random()*(b-a),pick=a=>a[Math.floor(Math.random()*a.length)];
const wrapA=a=>{while(a>Math.PI)a-=Math.PI*2;while(a<-Math.PI)a+=Math.PI*2;return a};
const seeded=s=>()=>(s=(s*16807)%2147483647)/2147483647;
const ord=n=>n+(['st','nd','rd'][n-1]||'th');
const fmtT=t=>Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0');
const mkc=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const A=(x,y)=>({x:x/2,y:(y+OY)/2});
const HW=44,WALL=57,WALLC=50,LAPS=4,SEASON=8,SAVE='aussie8-v2';

/* ---------- PIXEL ART TOOLKIT ---------- */
const PAL=['#0c0b0e','#1d1b22','#34313a','#55505c','#7b7581','#a8a2ac','#d6d1d4','#fbf8f2','#2a0f08','#4a1a0c','#6e2810','#8f3714','#a8431a','#c85d24','#d9763a','#e8955a','#f2b783','#f9d7ad','#3d2614','#5a3a22','#7a5236','#9a6a46','#b8a488','#c9b8a0','#d8c9b0','#e6d8c2','#13240f','#1f3a17','#2f5420','#45702b','#62903a','#8ab04e','#b9cf6a','#1c1030','#2e1a4a','#47286b','#64398a','#8a4f9e','#b8619b','#e0748a','#f59a78','#ffc46b','#ffe39a','#0f2a44','#1d4a72','#2f71a3','#58a2cf','#9fd3ee','#ffcd00','#00843d','#7a1018','#b8202c','#e63946','#5a2a24','#8a4f3a'].map(h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]);
const LUT=new Int16Array(32768).fill(-1),BAYER=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function palIdx(r,g,b){const k=((r>>3)<<10)|((g>>3)<<5)|(b>>3);let v=LUT[k];if(v<0){let bd=1e9;for(let i=0;i<PAL.length;i++){const p=PAL[i],dr=p[0]-r,dg=p[1]-g,db=p[2]-b,d=2*dr*dr+4*dg*dg+3*db*db;if(d<bd){bd=d;v=i}}LUT[k]=v}return v}
function quantize(g,w,h,spread){
  const id=g.getImageData(0,0,w,h),d=id.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const o=(y*w+x)*4,t=(BAYER[y&3][x&3]/16-0.47)*spread;
    const p=PAL[palIdx(clamp(d[o]+t,0,255)|0,clamp(d[o+1]+t,0,255)|0,clamp(d[o+2]+t,0,255)|0)];d[o]=p[0];d[o+1]=p[1];d[o+2]=p[2];d[o+3]=255}
  g.putImageData(id,0,0);
}
function pix(rows,map){const c=mkc(rows[0].length,rows.length),g=c.getContext('2d');rows.forEach((r,y)=>[...r].forEach((ch,x)=>{if(map[ch]){g.fillStyle=map[ch];g.fillRect(x,y,1,1)}}));return c}
function flipH(src){const c=mkc(src.width,src.height),g=c.getContext('2d');g.translate(src.width,0);g.scale(-1,1);g.drawImage(src,0,0);return c}
const SPR={
  nitro:pix(['..kkk..','..kwk..','.kkkkk.','kcwccck','kcwccck','kdddddk','kcwccck','kccccck','.kkkkk.'],{k:'#0c0b0e',c:'#3fd68a',w:'#e8fff0',d:'#00843d'}),
  cash:pix(['..kkkk..','...kk...','..kyyk..','.kyyyyk.','kyydyyyk','kydddyyk','kyyydyyk','.kkkkkk.'],{k:'#2a0f08',y:'#ffcd00',d:'#8f3714'}),
  flag:pix(['rwrbbbbbb','wwwbbbwbb','rwrbbbbbb','bbbbbbbwb','bwbbbwbbb','bbbbbbbbb'],{b:'#1d2f8a',w:'#fbf8f2',r:'#e63946'}),
  roo:pix(['..........kk..','.........kbbk.','.........kbebk','........kbbbbk','.......kbbbkk.','......kbbbk...','....kkbbbbk...','...kbbbllbk...','..kbbbbllbk...','.kbbbbbbbbk...','kbbk.kbbbbk...','kbk..kbbkbk...','kk...kkkkkkk..'],{k:'#1d1b22',b:'#a8a2ac',l:'#fbf8f2',e:'#0c0b0e'})
};
SPR.rooL=flipH(SPR.roo);

/* truck sprites: 24x14 pixel art, rotated nearest-neighbour into 32 headings with a dark outline */
function truckArt(body,dark,hi,sa,sb){
  const c=mkc(24,14),g=c.getContext('2d'),R=(col,x,y,w,h)=>{g.fillStyle=col;g.fillRect(x,y,w,h)};
  for(const [x,y] of [[3,0],[15,0],[3,11],[15,11]]){R('#141216',x,y,6,3);R('#4a4652',x+1,y===0?0:2,4,1);for(let i=0;i<6;i+=2)R('#2a2730',x+i,y+1,1,1)}
  R(dark,1,2,22,10);R(body,1,2,22,9);R(hi,2,2,20,1);
  R(dark,2,4,7,6);R('#141216',3,5,4,4);R('#4a4652',4,6,2,2);
  if(sa){R(sa,1,6,22,1);R(sb||sa,1,7,22,1)}
  R('#1d1b22',9,3,1,8);R(hi,10,3,5,8);if(sa){R(sa,10,6,5,1);R(sb||sa,10,7,5,1)}
  R('#fbf8f2',11,4,3,2);
  R('#ffe39a',15,3,1,1);R('#ffe39a',15,5,1,1);R('#ffe39a',15,8,1,1);R('#ffe39a',15,10,1,1);
  R('#1d4a72',16,3,2,8);R('#9fd3ee',16,4,1,2);
  R('#34313a',23,4,1,6);R('#ffe39a',23,3,1,2);R('#ffe39a',23,9,1,2);R('#e63946',1,3,1,1);R('#e63946',1,10,1,1);
  return c;
}
function rotSprites(src,noOutline){
  const sw=src.width,sh=src.height,sd=src.getContext('2d').getImageData(0,0,sw,sh).data,N=32,S=30,out=[],sh2=[];
  for(let k=0;k<N;k++){
    const a=k/N*Math.PI*2,ca=Math.cos(a),sa=Math.sin(a),c=mkc(S,S),g=c.getContext('2d'),id=g.createImageData(S,S),d=id.data;
    for(let y=0;y<S;y++)for(let x=0;x<S;x++){
      const dx=x+0.5-S/2,dy=y+0.5-S/2,ix=Math.floor(dx*ca+dy*sa+sw/2),iy=Math.floor(-dx*sa+dy*ca+sh/2);
      if(ix>=0&&iy>=0&&ix<sw&&iy<sh){const si=(iy*sw+ix)*4;if(sd[si+3]>0){const o=(y*S+x)*4;d[o]=sd[si];d[o+1]=sd[si+1];d[o+2]=sd[si+2];d[o+3]=255}}

async function loadArt(){
  if(!ARTM)return;
  const J=[loadImg('trucks',ARTM.trucks.src),loadImg('debris',ARTM.debris.src)];
  for(const k in ARTM.fx)J.push(loadImg('fx_'+k,ARTM.fx[k].src));
  for(const k in ARTM.wildlife)J.push(loadImg('wl_'+k,ARTM.wildlife[k].src));
  for(const k in ARTM.pickups)J.push(loadImg('pk_'+k,ARTM.pickups[k]));
  ARTM.backdrops.forEach((p,i)=>J.push(loadImg('bd_'+i,p)));
  for(const k in ARTM.props)J.push(loadImg('pr_'+k,ARTM.props[k]));
  for(const k in ARTM.radio)J.push(loadImg('rd_'+k,ARTM.radio[k]));
  for(const k in ARTM.hud)J.push(loadImg('hud_'+k,ARTM.hud[k]));
  await Promise.all(J);
  const tm=ARTM.trucks,ti=ART.img.trucks;
  if(ti)for(const id in tm.rows){const st=[];for(let s=0;s<tm.stages;s++)st.push(rotSprites(imgCanvas(ti,s*tm.w,tm.rows[id]*tm.h,tm.w,tm.h),true));SPRITES[id]=st}

}

function nextEvent(){
  const s=SCHED[G.race];if(s&&!G.used.includes(s))return EVENTS.find(e=>e.id===s);
  const av=EVENTS.filter(e=>!e.sched&&!e.repeat&&!G.used.includes(e.id)&&(!e.when||e.when()));
  if(!av.length)return EVENTS.find(e=>e.id==='quiet');
  const top=Math.max(...av.map(e=>e.pri||0));return pick(av.filter(e=>(e.pri||0)===top));
}
function apply(fx){
  const out=[],reacts=[],gone=[],joined=[];
  if(fx.money){G.money=Math.max(0,G.money+fx.money);out.push([(fx.money>0?'+$':'−$')+Math.abs(fx.money),fx.money>0])}
  if(fx.karma){G.karma=clamp(G.karma+fx.karma,-100,100);out.push(['Karma '+(fx.karma>0?'+':'−')+Math.abs(fx.karma),fx.karma>0])}
  if(fx.rival){G.rival=clamp(G.rival+fx.rival,-100,100);out.push(['Duke '+(fx.rival>0?'+':'−')+Math.abs(fx.rival),fx.rival>0])}
  if(fx.xp){gainXP(fx.xp);out.push(['+'+fx.xp+' XP',true])}
  if(fx.nitro){G.nitro=clamp(G.nitro+fx.nitro,0,9);out.push([(fx.nitro>0?'+':'−')+Math.abs(fx.nitro)+' nitro',fx.nitro>0])}
  if(fx.upg)for(const k in fx.upg){G.upg[k]=Math.min(5,G.upg[k]+fx.upg[k]);out.push(['Engine +1',true])}
  if(fx.flag)G.flags[fx.flag]=G.race;
  if(fx.unflag)delete G.flags[fx.unflag];
  if(fx.join){const c=G.crew[fx.join];c.in=true;c.met=true;c.aff=fx.joinAff||0;joined.push(fx.join)}
  if(fx.leave){const c=G.crew[fx.leave];if(c.in){c.in=false;c.left=G.race;gone.push(fx.leave)}}
  if(fx.aff)for(const id in fx.aff){
    if(!G.crew[id].in)continue;let d=fx.aff[id];if(d>0)d=Math.round(d*(1+G.stats.charm*0.1));
    G.crew[id].aff=clamp(G.crew[id].aff+d,-100,100);reacts.push({id,d,line:pick(CREW[id][d>0?'up':'down'])});
  }
  for(const id in G.crew){const c=G.crew[id];if(c.in&&c.aff<=-40){c.in=false;c.left=G.race;gone.push(id)}}
  return{out,reacts,gone,joined};
}
function gainXP(x){G.xp+=x;let up=0;while(G.xp>=G.lvl*250){G.xp-=G.lvl*250;G.lvl++;G.sp++;up++}return up}

function endRace(){
  const rk=rank(),pi=rk.indexOf(R.pl);

  const won=Math.round(PRIZE[pi]*(1+G.race*0.1)*dexMult()/10)*10,xp=XPP[pi]+R.picks*10;
  G.money+=won+R.cash;const lv=gainXP(xp);
  G.nitro=clamp(R.pl.nitro-R.pl.bonus,0,9);
  const notes=[];
  if(G.flags.tookBribe!==undefined){const di=rk.findIndex(c=>c.id==='duke');
    if(pi<di){G.rival=clamp(G.rival-40,-100,100);notes.push('You took Duke’s money and beat him anyway. He wants blood now (Duke −40).')}
    else{G.rival=clamp(G.rival+10,-100,100);notes.push('Duke tips his hat as you roll in behind him. A deal is a deal (Duke +10).')}
    delete G.flags.tookBribe}
  if(G.flags.dukeSab!==undefined){notes.push('Duke fought a loose steering rack all race. He doesn’t know why. Yet.');delete G.flags.dukeSab}
  if(R.crashes)notes.push('You were in '+R.crashes+' crash'+(R.crashes>1?'es':'')+' this race.');
  if(dexMult()>1)notes.push('Dex squeezed an extra 20% out of the purse.');
  if(juneBonus())notes.push('June’s spotting earned you '+juneBonus()+' bonus nitro this race.');
  const T=R.T;G.race++;G.stage=G.race>=SEASON?'end':'event';save();
  lastRes={rk:rk.map(c=>({id:c.id,ft:c.fin?c.ft:null})),pi,won,cash:R.cash,xp,lv,notes,track:T.name};
  setMode('menu');showResults();
}

  lines.push(k>=35?'Fans line the fences to shake your hand. Kids paint a big 8 on their bikes.':k<=-35?'You have the money, but every pit crew locks its toolbox when you walk by.':'Some folks cheer you, some boo. Most just want to see you race.');
  const c=G.crew;
  lines.push(c.rosa.in?(c.rosa.aff>=60?'Rosa opens a garage in Broken Hill. Your truck goes on the hoist first, free of charge, forever.':'Rosa signs on for next season. She says it’s for the pay. It isn’t only that.'):'Rosa runs a shop two states away now. She doesn’t take your calls.');
  if(c.dex.met)lines.push(c.dex.in?(c.dex.aff>=60?'Dex parlays your season into a sponsorship deal with too many zeros. You get half. Probably.':'Dex moves on to a bigger hustle but sends a postcard from Darwin.'):'Dex is last seen selling “official” jackets with your face on them.');
  if(c.june.met)lines.push(c.june.in?(c.june.aff>=60?'June gets a factory seat next year. In her first interview she thanks one person: you.':'June keeps spotting for you, clipboard and all.'):'June drives for Duke’s team now. She’s fast. She doesn’t wave.');
  else lines.push('Somewhere, a rookie named June found someone else to believe in.');
  lines.push(G.rival>=30?'Duke Vance shouts you a beer at the presentation night. Somewhere along the way, a rival became a mate.':G.rival<=-30?'Duke Vance swears he’ll put you in the tyre wall next season. You believe him.':'Duke Vance nods at you across the presentation night. Respect, maybe.');
  ov.innerHTML=`<div class="panel"><p class="kicker">Season over</p><div class="title-logo" style="font-size:clamp(20px,4.4vw,40px)">${title.toUpperCase()}</div>
  ${lines.map(l=>`<p class="story" style="margin-bottom:10px">${l}</p>`).join('')}
  <div class="pills" style="margin-top:12px"><span class="pill">Karma ${k}</span><span class="pill">Duke ${G.rival}</span><span class="pill">Level ${G.lvl}</span><span class="pill">$${G.money.toLocaleString()}</span></div>
  <div class="actions"><button class="btn" data-act="new">Start a new season</button><button class="btn ghost" data-act="title">Title screen</button></div></div>`;
}
function resume(){
  if(!G)return showMenu();
  if(G.stage==='end'||G.race>=SEASON)return showEnding();
  if(G.stage==='event'){setMode('menu');return showEvent(nextEvent())}
  showGarage();
}
ov.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='menu')showMenu();
  else if(a==='new'){G=fresh();save();setMode('menu');showEvent(nextEvent())}
  else if(a==='cont'){G=load();resume()}
  else if(a==='title')showTitle();
  else if(a.startsWith('ch:'))choose(+a.slice(3));
  else if(a==='garage')showGarage();
  else if(a.startsWith('stat:')){const k=a.slice(5);if(G.sp>0&&G.stats[k]<5){G.stats[k]++;G.sp--;showGarage()}}
  else if(a.startsWith('upg:')){const k=a.slice(4),l=G.upg[k],cost=Math.round(UPC[l]*discount()/10)*10;if(l<5&&G.money>=cost){G.money-=cost;G.upg[k]++;showGarage()}}
  else if(a==='nitro'){const cost=Math.round(150*discount()/10)*10;if(G.nitro<9&&G.money>=cost){G.money-=cost;G.nitro++;showGarage()}}
  else if(a==='race')startRace();
  else if(a.startsWith('ctl:')){const v=a.slice(4);if(v==='lefty')CTL.lefty=!CTL.lefty;else CTL.mode=v;applyCtl();
    b.closest('.card').outerHTML=ctlUI()}
  else if(a==='after'){G.race>=SEASON?showEnding():(setMode('menu'),showEvent(nextEvent()))}
});

/* ---------- INPUT + LOOP ---------- */
const GAMEKEYS=['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'];
addEventListener('keydown',e=>{
  if(mode==='title'&&(e.code==='Enter'||e.code==='Space')){e.preventDefault();showMenu();return}
  if(mode!=='race')return;
  if(GAMEKEYS.includes(e.code))e.preventDefault();
  if(!K[e.code]&&(e.code==='Space'||e.code==='ShiftLeft'||e.code==='ShiftRight'))nitroPress=true;
  if(!K[e.code]&&(e.code==='KeyP'||e.code==='Escape'))R.paused=!R.paused;
  K[e.code]=true;
});
addEventListener('keyup',e=>{K[e.code]=false});
addEventListener('blur',()=>{for(const k in K)K[k]=false;if(mode==='race'&&R)R.paused=true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&mode==='race'&&R)R.paused=true});
cv.addEventListener('pointerdown',()=>{if(mode==='race'&&R&&R.paused)R.paused=false});
const ptrs=new Map();
function syncTS(){const ks=new Set();for(const p of ptrs.values())if(p.key)ks.add(p.key);for(const k of ['l','r','g','b'])TS[k]=ks.has(k);
  pad.querySelectorAll('.pb').forEach(b=>b.classList.toggle('on',ks.has(b.dataset.k)))}
function vis(b){return getComputedStyle(b).display!=='none'}
function keyAt(zone,x,y){
  const bs=[...zone.querySelectorAll('.pb')].filter(vis);
  if(zone.classList.contains('steer')){const [l,r]=bs.map(b=>b.getBoundingClientRect());if(!l)return null;const mid=(l.left+l.right+r.left+r.right)/4;return x<mid?'l':'r'}
  let best=null,bd=1e9;for(const b of bs){const r=b.getBoundingClientRect(),d=Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))-r.width/2;if(d<bd){bd=d;best=b.dataset.k}}
  return bd<70?best:null;
}
function ptrUpdate(p,x,y){
  if(p.stick){const z=p.zone.getBoundingClientRect(),dx=x-p.ox,dy=y-p.oy,m=Math.hypot(dx,dy),k=m>58?58/m:1;
    TS.stick={on:true,dx,dy,mag:m};stickEl.firstChild.style.transform=`translate(${dx*k}px,${dy*k}px)`;return}
  const k=keyAt(p.zone,x,y);if(k!==p.key){if(k==='n'){nitroPress=true}p.key=k;syncTS()}
}
pad.addEventListener('pointerdown',e=>{
  if(e.target.id==='pauseBtn'){e.preventDefault();if(R)R.paused=!R.paused;return}
  e.preventDefault();if(R&&R.paused){R.paused=false;return}
  const zone=e.target.closest('.zone');if(!zone)return;try{pad.setPointerCapture(e.pointerId)}catch(_){}
  const p={zone,key:null,stick:false};
  if(zone.classList.contains('steer')&&CTL.mode==='stick'){for(const [id,q] of ptrs)if(q.stick)ptrs.delete(id);
    const z=zone.getBoundingClientRect();p.stick=true;p.ox=e.clientX;p.oy=e.clientY;
    stickEl.style.left=(e.clientX-z.left)+'px';stickEl.style.top=(e.clientY-z.top)+'px';stickEl.classList.add('on');stickEl.firstChild.style.transform='';TS.stick={on:true,dx:0,dy:0,mag:0}}
  ptrs.set(e.pointerId,p);ptrUpdate(p,e.clientX,e.clientY);if(p.key==='n')buzz(10);
});
pad.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(p){e.preventDefault();ptrUpdate(p,e.clientX,e.clientY)}});
const ptrEnd=e=>{const p=ptrs.get(e.pointerId);if(!p)return;ptrs.delete(e.pointerId);if(p.stick){stickEl.classList.remove('on');TS.stick={on:false}}syncTS()};
['pointerup','pointercancel','lostpointercapture'].forEach(t=>pad.addEventListener(t,ptrEnd));
pad.addEventListener('contextmenu',e=>e.preventDefault());
pad.addEventListener('touchend',e=>{if(e.touches.length===0&&ptrs.size){ptrs.clear();stickEl.classList.remove('on');TS.stick={on:false};syncTS()}});
document.addEventListener('gesturestart',e=>{if(mode==='race')e.preventDefault()});
applyCtl();
let last=performance.now();
function loop(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(mode==='race'&&R){if(!R.paused)updRace(dt);if(mode==='race')drawRace()}
  requestAnimationFrame(loop);
}
showTitle();requestAnimationFrame(loop);
window.__A8={get G(){return G},get R(){return R},TRACKS,TS,ART,SPRITES,DMG,spawnDebris};
loadArt().catch(e=>console.warn('Aussie 8: art load failed',e));
}
</script>
